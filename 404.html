<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page not found — YTL ChatGPT Workshop</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      * { box-sizing: border-box; }
      html { -webkit-font-smoothing: antialiased; }
      body { display: grid; min-height: 100svh; margin: 0; place-items: center; padding: 24px; background: #f8f7f3; color: #0b0f17; font-family: "Inter", sans-serif; }
      main { width: min(660px, 100%); padding: 36px; border: 1px solid #d1d4d6; border-radius: 16px; background: #fff; }
      .trilateral-rail { display: grid; grid-template-columns: repeat(3, 24px); height: 5px; margin-bottom: 24px; overflow: hidden; border-radius: 4px; }
      .trilateral-rail span:nth-child(1) { background: #0a1b38; }
      .trilateral-rail span:nth-child(2) { background: #094dad; }
      .trilateral-rail span:nth-child(3) { background: #c70424; }
      .code { margin: 0 0 18px; color: #094dad; font-size: 14px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; }
      h1 { margin: 0; color: #0b0f17; font-size: clamp(48px, 10vw, 76px); font-weight: 700; letter-spacing: -.05em; line-height: 1; text-wrap: balance; }
      p { max-width: 520px; margin: 26px 0; color: #576175; font-size: 18px; line-height: 1.55; text-wrap: pretty; }
      a { display: inline-flex; min-height: 48px; align-items: center; padding: 0 20px; border-radius: 8px; background: #094dad; color: white; font-size: 15px; font-weight: 600; text-decoration: none; transition-property: background-color, scale; transition-duration: 180ms; }
      a:hover { background: #0a1b38; }
      a:active { scale: .96; }
      a:focus-visible { outline: 2px solid #094dad; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <div class="trilateral-rail" aria-hidden="true"><span></span><span></span><span></span></div>
      <p class="code">Error 404</p>
      <h1>Page not found</h1>
      <p>The requested workshop resource may have moved or may not be available yet.</p>
      <a href="./">Return to the resource hub</a>
    </main>
  </body>
</html>
